name: pi-llama

services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: pi-llama
    restart: unless-stopped
    ports:
      - "${LLAMA_PORT:-5370}:8080"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/${MODEL_FILE:-Qwen_Qwen3.5-4B-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8080
      --ctx-size ${CTX_SIZE:-4096}
      --threads ${LLAMA_THREADS:-4}
      --cont-batching
      --n-gpu-layers 0
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
